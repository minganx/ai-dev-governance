[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-governance-hooks"
version = "0.1.0"
description = "Shared pre-commit hooks for AI development governance"
requires-python = ">=3.9"

[project.scripts]
check-commit-message = "hooks.check_commit_message:main"

[tool.setuptools]
packages = ["hooks"]
